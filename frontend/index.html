<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evacuation Simulation</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- modebar -->
    <header id="abms-modebar">
      <span class="app-title">ABMS <span>//</span> Pedestrian Sim</span>
      <span class="mode-indicator" id="mode-indicator">
        <span class="dot"></span>
        <span id="mode-label">edit</span>
      </span>
      <button id="btn-mode-toggle">Run Simulation</button>
    </header>

    <!-- toolbar -->
    <div id="abms-panel">
      <div class="panel-inner">
        <span class="panel-label">Grid Editor</span>

        <div class="tool-group">
          <span class="group-label">Terrain</span>
          <div class="tool-row">
            <button class="tool-btn active" id="btn-draw">Draw</button>
            <button class="tool-btn" id="btn-erase">Erase</button>
          </div>
        </div>

        <div class="tool-group">
          <span class="group-label">Zones</span>
          <div class="tool-row">
            <button class="tool-btn" id="btn-goal">Goal</button>
          </div>
        </div>

        <div class="tool-group">
          <span class="group-label">Map</span>
          <div class="tool-row">
            <button class="tool-btn danger" id="btn-clear">Clear</button>
          </div>
        </div>
      </div>
    </div>

    <!-- canvas -->
    <div id="canvas-wrap">
      <canvas id="simCanvas"></canvas>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
